# Configuración mínima de pytest para el repositorio.
# pythonpath = . añade la raíz al sys.path para que tests/ pueda importar backend y verificacion
# sin modificar sys.path ni cambiar de directorio al importarse.
# Este archivo NO sustituye a verificacion/conftest.py: al estar en la raíz, pytest toma la raíz
# como rootdir/confcutdir y sigue cargando ese conftest (su pytest_configure, fixtures y chdir).
# Los markers se declaran también aquí para que existan aunque se ejecute solo tests/;
# declararlos dos veces es inocuo.
[pytest]
pythonpath = .
markers =
    hallazgo(id): falla hasta que se corrija el hallazgo de la auditoría
    lento: necesita pesos reales, dataset o descargas
